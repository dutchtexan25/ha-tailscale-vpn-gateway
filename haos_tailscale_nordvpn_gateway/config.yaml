name: Tailscale NordVPN Exit Gateway
version: 0.1.6
slug: tailscale_nordvpn_gateway
description: Tailscale exit node with NordVPN NordLynx egress, isolated from the Home Assistant host network.
url: https://github.com/dutchtexan25/ha-tailscale-vpn-gateway/tree/haos-nordvpn-wg/haos_tailscale_nordvpn_gateway
arch:
  - aarch64
startup: services
boot: auto
init: false
host_network: false
devices:
  - /dev/net/tun
privileged:
  - NET_ADMIN
  - NET_RAW
kernel_modules: true
ports:
  41641/udp: 41642
options:
  nordvpn_token: ""
  nordvpn_target: San_Francisco
  tailscale_auth_key: ""
  tailscale_hostname: ha-nordvpn-gateway
  reconnect_after_hours: 168
  advertise_exit_node: false
schema:
  nordvpn_token: password?
  nordvpn_target: str
  tailscale_auth_key: password?
  tailscale_hostname: str
  reconnect_after_hours: int(1,720)
  advertise_exit_node: bool
